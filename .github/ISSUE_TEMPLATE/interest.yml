name: Register interest
description: Tell me what you need from the paid pipeline templates and I'll let you know when they're ready.
title: "Interest: "
labels: ["interest"]
body:
  - type: markdown
    attributes:
      value: |
        Issues on this repository are **public**. Please don't include company names,
        tenant details or anything confidential. A rough description is plenty.
  - type: dropdown
    id: platform
    attributes:
      label: Which platform are you moving to?
      options:
        - Azure DevOps
        - GitHub Actions
        - Both
        - Not sure yet
    validations:
      required: true
  - type: dropdown
    id: scale
    attributes:
      label: Roughly how many Dataverse environments are in your pipeline path?
      options:
        - 1-3
        - 4-10
        - More than 10
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What would you need from a migration kit?
      description: What is hardest about leaving ALM Accelerator for you?
    validations:
      required: false
  - type: checkboxes
    id: notice
    attributes:
      label: Before you submit
      options:
        - label: I haven't included confidential information.
          required: true
